# =============================================================================
# Data used by the deterministic (mock / fallback) AI engine to understand
# free text in French, English and Arabic, and by every provider to drive the
# "Describe your project" conversation. Enrich it without touching code.
# Keywords are matched on lower-cased, accent-free text.
# =============================================================================


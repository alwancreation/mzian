# Ordered rules used to recommend a solution (first match wins). Expressions use
# Symfony ExpressionLanguage with: sector (string), has('feature'),
# features_count, unknown_count (features no solution supports).
solution_rules:
  - { solution: custom_web_application, when: "unknown_count >= 3" }
  - { solution: car_rental_management, when: "sector == 'car_rental' and (has('contracts') or has('customer_management') or has('vehicle_tracking') or has('statistics') or has('online_payments') or has('vehicle_management'))" }
  - { solution: car_rental_website, when: "sector == 'car_rental'" }
  - { solution: restaurant_website, when: "sector == 'restaurant'" }
  - { solution: hotel_website, when: "sector == 'hotel' and not has('availability_calendar')" }
  - { solution: booking_system, when: "sector == 'hotel'" }
  - { solution: appointment_management, when: "sector == 'beauty' or has('appointments')" }
  - { solution: booking_system, when: "sector == 'travel_agency' or has('online_reservations') or has('online_booking')" }
  - { solution: ecommerce_starter, when: "has('online_shop') or has('cart_checkout') or (sector == 'retail' and not has('no_online_sales'))" }
  - { solution: mini_crm, when: "has('customer_management') and not has('pages')" }
  - { solution: business_website, when: "sector in ['professional', 'real_estate', 'other'] or features_count >= 3" }
  - { solution: website_starter, when: "true" }


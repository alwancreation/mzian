# =============================================================================
# External providers — imported by `mzian:setup` (Admin > Providers afterwards).
#
# driver   = PHP implementation (see PROVIDERS.md to add one)
# settings = NON-secret configuration. Secrets are never stored here:
#            "env" maps a credential name to the environment variable used as a
#            fallback when no encrypted credential has been saved in the admin.
# Mock providers never spend money nor call external APIs (local development).
# Prices are in MAJOR units of the platform currency.
# =============================================================================

providers:
  # ------------------------------------------------------------------ AI
  - code: mock_ai
    type: ai
    driver: mock
    name: "Mock AI (deterministic, offline)"
    provisioning_method: mock
    enabled: true
    default_if_env: { MZIAN_AI_PROVIDER: mock }
    capabilities: [requirement_analysis, conversation, content_generation]
  - code: openai
    type: ai
    driver: openai
    name: "OpenAI"
    provisioning_method: api
    enabled_if_env: { MZIAN_AI_PROVIDER: openai }
    default_if_env: { MZIAN_AI_PROVIDER: openai }
    settings:
      base_url: "https://api.openai.com/v1"
      model_env: OPENAI_MODEL
      default_model: "gpt-4.1-mini"
      env: { api_key: OPENAI_API_KEY }
      # Used to estimate the AI cost of each call (USD per million tokens). Check your contract.
      price_per_million_tokens: { input: 0.4, output: 1.6 }
    capabilities: [requirement_analysis, conversation, content_generation, json_schema]
  - code: claude
    type: ai
    driver: claude
    name: "Anthropic Claude"
    provisioning_method: api
    enabled_if_env: { MZIAN_AI_PROVIDER: claude }
    default_if_env: { MZIAN_AI_PROVIDER: claude }
    settings:
      base_url: "https://api.anthropic.com/v1"
      model_env: ANTHROPIC_MODEL
      default_model: "claude-sonnet-5-5"
      env: { api_key: ANTHROPIC_API_KEY }
      price_per_million_tokens: { input: 3.0, output: 15.0 }
    capabilities: [requirement_analysis, conversation, content_generation, tool_use]

  # ------------------------------------------------------------------ Hosting
  - code: mock_hosting
    type: hosting
    driver: mock
    name: "Mock Hosting (simulated, no cost)"
    provisioning_method: mock
    enabled: true
    default: true
    settings: { region: "eu-simulated", panel_url: "https://panel.mock-hosting.test" }
    capabilities: [create_account, create_hosting, configure_domain, ssl, email, deploy]
    hosting_plans:
      - { code: starter, name: "Starter (10 GB, 1 DB, 5 e-mails)", price: 40, billing_period: year, specs: { storage_gb: 10, databases: 1, email_accounts: 5, php: "8.3" }, capabilities: [ssl, email] }
      - { code: business, name: "Business (30 GB, 3 DB, 20 e-mails)", price: 72, billing_period: year, specs: { storage_gb: 30, databases: 3, email_accounts: 20, php: "8.3" }, capabilities: [ssl, email, backups] }
      - { code: pro, name: "Pro (100 GB, 10 DB, 50 e-mails)", price: 120, billing_period: year, specs: { storage_gb: 100, databases: 10, email_accounts: 50, php: "8.3" }, capabilities: [ssl, email, backups, staging] }

  # ------------------------------------------------------------------ Domains
  - code: mock_domain
    type: domain
    driver: mock
    name: "Mock Registrar (simulated, no cost)"
    provisioning_method: mock
    enabled: true
    default: true
    settings:
      # Yearly registration price per TLD (major units). "default" applies to other TLDs.
      tld_prices: { ".com": 12, ".net": 14, ".org": 13, ".ma": 25, ".fr": 10, "default": 15 }
      nameservers: ["ns1.mock-registrar.test", "ns2.mock-registrar.test"]
    capabilities: [check_availability, register, configure_dns]

  # ------------------------------------------------------------------ Payments
  # Hosted checkouts only: Mzian never sees card data. Webhooks: POST /webhooks/payment/<code>
  - code: mock_payment
    type: payment
    driver: mock
    name: "Mock Payments (simulated checkout, no money)"
    provisioning_method: mock
    enabled_if_env: { MZIAN_PAYMENT_PROVIDER: mock }
    default_if_env: { MZIAN_PAYMENT_PROVIDER: mock }
    settings:
      env: { webhook_secret: MZIAN_WEBHOOK_SECRET }
    capabilities: [checkout, webhook, refund]
  - code: stripe
    type: payment
    driver: stripe
    name: "Stripe Checkout"
    provisioning_method: api
    enabled_if_env: { MZIAN_PAYMENT_PROVIDER: stripe }
    default_if_env: { MZIAN_PAYMENT_PROVIDER: stripe }
    settings:
      base_url: "https://api.stripe.com/v1"
      # Maximum age of a signed webhook (replay protection).
      tolerance_seconds: 300
      env: { api_key: STRIPE_SECRET_KEY, webhook_secret: STRIPE_WEBHOOK_SECRET }
    capabilities: [checkout, webhook, refund]
  - code: bank_transfer
    type: payment
    driver: manual
    name: "Bank transfer (confirmed by an administrator)"
    provisioning_method: manual
    enabled_if_env: { MZIAN_PAYMENT_PROVIDER: manual }
    default_if_env: { MZIAN_PAYMENT_PROVIDER: manual }
    settings:
      method: bank_transfer
      # Shown to the customer with the order number as payment reference (Admin > Providers).
      beneficiary: "Mzian.net"
      bank_name: ""
      iban: ""
      bic: ""
    capabilities: [offline]

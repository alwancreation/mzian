# Production-like stack: immutable images, no bind mounts, APP_ENV=prod.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Secrets (APP_SECRET, MZIAN_ENCRYPTION_KEY, API keys, DB passwords) must be
# provided through the environment (e.g. an untracked .env file next to this one
# or your orchestrator's secret store) — never committed.

x-php-prod: &php-prod
  build:
    context: .
    target: php_prod
  image: ${MZIAN_IMAGE:-mzian-php}:${MZIAN_IMAGE_TAG:-latest}
  # Optional provider keys and selections (OPENAI_API_KEY, STRIPE_SECRET_KEY,
  # MZIAN_AI_PROVIDER...), chmod 600, never committed. Prefer Admin > Providers
  # (encrypted credentials). The database root password is not given to PHP.
  env_file:
    - path: ./app.env
      required: false

services:
  php:
    <<: *php-prod
    # Declared on the service, not in the anchor: Compose v2 ignores !reset in a merged anchor
    # and would keep the development bind mount of the sources.
    volumes: !reset []
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      MZIAN_ENCRYPTION_KEY: ${MZIAN_ENCRYPTION_KEY:?MZIAN_ENCRYPTION_KEY must be set}
      MZIAN_WEBHOOK_SECRET: ${MZIAN_WEBHOOK_SECRET:?MZIAN_WEBHOOK_SECRET must be set}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MZIAN_PUBLIC_BASE_URL: ${MZIAN_PUBLIC_BASE_URL:?MZIAN_PUBLIC_BASE_URL must be set (e.g. https://mzian.net)}
      MZIAN_MOCK_LATENCY_MS: 0

  worker:
    <<: *php-prod
    # Declared on the service, not in the anchor: Compose v2 ignores !reset in a merged anchor
    # and would keep the development bind mount of the sources.
    volumes: !reset []
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      MZIAN_ENCRYPTION_KEY: ${MZIAN_ENCRYPTION_KEY:?MZIAN_ENCRYPTION_KEY must be set}
      MZIAN_WEBHOOK_SECRET: ${MZIAN_WEBHOOK_SECRET:?MZIAN_WEBHOOK_SECRET must be set}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MZIAN_PUBLIC_BASE_URL: ${MZIAN_PUBLIC_BASE_URL:?MZIAN_PUBLIC_BASE_URL must be set (e.g. https://mzian.net)}
      MZIAN_MOCK_LATENCY_MS: 0

  nginx:
    build:
      context: .
      target: nginx
    image: ${MZIAN_NGINX_IMAGE:-mzian-nginx}:${MZIAN_IMAGE_TAG:-latest}
    volumes: !reset []

  # No default password in production.
  database:
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set (letters and digits, e.g. openssl rand -hex 24)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}

  mailpit:
    profiles: ["dev-tools"]

  assets:
    profiles: ["dev-tools"]

  # Demo hosting for the "local" deployment provider: off in production (use a real
  # hosting/deployment provider). Enable with: --profile demo
  apps:
    profiles: ["demo"]

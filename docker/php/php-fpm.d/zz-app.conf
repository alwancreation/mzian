[global]
daemonize = no
log_limit = 8192

[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
ping.path = /ping
pm.status_path = /status
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

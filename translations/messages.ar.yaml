how:
  title: "كيف يحوّل مزيان فكرتك إلى حل على الإنترنت"
  lead: "تصف نشاطك، يقترح الذكاء الاصطناعي الحل المناسب بالسعر المناسب، يصادق عليه مسؤول من مزيان، ثم يقوم وكلاؤنا الأذكياء بإنجاز تطبيقك وتسليمه."
  steps:
    describe:
      title: "صِف نشاطك"
      text: "اختر قطاعك واشرح احتياجك بكلماتك، بالعربية أو الفرنسية أو الإنجليزية."
    questions:
      title: "بضعة أسئلة دقيقة"
      text: "تتكيف الأسئلة مع أجوبتك: عدد السيارات، الحجوزات، الأداء، العقود…"
    analysis:
      title: "تحليل بالذكاء الاصطناعي"
      text: "يحوّل الذكاء الاصطناعي طلبك إلى متطلبات منظمة ويوصي بالحل المناسب."
    proposal:
      title: "عرض وسعر واضحان"
      text: "الميزات، الاستضافة، اسم النطاق والخدمات: سعر محسوب بشفافية."
    order:
      title: "الطلب والأداء"
      text: "اطلب عبر الإنترنت وادفع بأمان."
    validation:
      title: "مصادقة بشرية"
      text: "يتحقق مسؤول من مزيان من مشروعك ويصادق على انطلاقه."
    build:
      title: "إنجاز آلي"
      text: "يحجز الوكلاء الأذكياء الاستضافة ويهيئون النطاق ويطورون حلك انطلاقًا من نماذج مجرّبة."
    quality:
      title: "اختبارات ومراقبة الجودة"
      text: "تُنفّذ اختبارات تقنية حقيقية: الصفحات، HTTPS، النطاق، الملفات، العرض على الهاتف."
    delivery:
      title: "التسليم"
      text: "تتوصل بمعلومات الدخول وعنوان موقعك ودليل الاستخدام في فضاء الزبون."
  human:
    title: "مصادقة بشرية واحدة، في الوقت المناسب"
    text: "بعد الأداء، يصادق مسؤول من مزيان على الإنجاز. بعدها تتولى الأتمتة الباقي ويمكنك تتبع التقدم مباشرة في حسابك."
  safety:
    title: "أتمتة تحت المراقبة"
    budget: "ميزانيات وسقوف للإنفاق: ما فوقها يتطلب موافقة المسؤول."
    secrets: "معلومات الدخول مشفّرة ولا تُرسل أبدًا كنص واضح إلى الذكاء الاصطناعي."
    tests: "لا تسليم إذا فشلت اختبارات حرجة."
    audit: "كل عملية مسجّلة في سجل التدقيق."
faq:
  title: "الأسئلة الشائعة"
  lead: "كل ما تحتاج معرفته قبل إطلاق مشروعك مع مزيان."
  more_questions: "سؤال آخر؟ راسلنا."
  items:
    what:
      q: "ما هو مزيان؟"
      a: "مزيان منصة تحلل احتياجات المقاولات الصغيرة بالذكاء الاصطناعي، وتقترح حلًا رقميًا مناسبًا (موقع، حجز، متجر، إدارة عملاء، تطبيق أعمال) وتنجزه بشكل آلي."
    how_long:
      q: "كم يستغرق إطلاق موقعي؟"
      a: "تُسلّم أغلب الحلول المبنية على نماذجنا في بضعة أيام بعد المصادقة على طلبك. المدة التقديرية مذكورة في العرض."
    price:
      q: "كيف يُحسب السعر؟"
      a: "يُحسب السعر بواسطة محرك التسعير لدينا (وليس بالذكاء الاصطناعي وحده): الحل الأساسي، الميزات، الاستضافة، النطاق والخدمات. كل شيء مفصّل قبل الطلب."
    ai:
      q: "هل يقرر الذكاء الاصطناعي كل شيء؟"
      a: "لا. الذكاء الاصطناعي يحلل ويقترح، ومسؤول من مزيان يصادق على كل مشروع، واختبارات تقنية حقيقية تراقب الجودة قبل التسليم."
    domain:
      q: "هل يمكنني استعمال اسم نطاقي الخاص؟"
      a: "نعم. يمكنك الإشارة إلى نطاق موجود أو تركنا نحجز لك نطاقًا جديدًا."
    hosting:
      q: "هل الاستضافة مشمولة؟"
      a: "نعم، السنة الأولى من الاستضافة مشمولة في العرض. ثم تغطي الاشتراكات الاستضافة والصيانة والدعم."
    changes:
      q: "هل يمكنني طلب تعديلات؟"
      a: "نعم. قبل الإنجاز قد يطلب منك المسؤول توضيحات، وبعد التسليم يتوفر الدعم من فضاء الزبون."
    own:
      q: "هل أنا مالك موقعي؟"
      a: "نعم، محتواك وبياناتك ملك لك. لكل مشروع مستودع شيفرة خاص به."
    payment:
      q: "ما هي وسائل الأداء المقبولة؟"
      a: "الأداء بالبطاقة (عبر مزود الأداء) والتحويل البنكي. تظهر الوسائل المتاحة عند الأداء."
    languages:
      q: "هل يمكن أن يكون موقعي متعدد اللغات؟"
      a: "نعم: الفرنسية والإنجليزية والعربية (من اليمين إلى اليسار) مدعومة."

    approval: { title: "Approval", text: "Every project is approved by a Mzian administrator before the build starts. If rejected, the amount paid is refunded." }
    delivery: { title: "Delivery", text: "Delivery happens after the technical tests and quality control succeed. Access details are shared securely in the customer area." }
    liability: { title: "Liability", text: "The customer remains responsible for the content published on their solution." }
  privacy:
    title: "Privacy policy"
    data: { title: "Data we collect", text: "We collect the information needed to study and build your project (contact details, description of your needs, questionnaire answers)." }
    analytics: { title: "Audience measurement", text: "Our audience measurement uses no cookie and stores no IP address." }
    ai: { title: "Artificial intelligence", text: "Your description may be analysed by an AI provider. No password or credential is ever sent to it." }
    security: { title: "Security", text: "Credentials are encrypted, access is logged and protected." }
    rights: { title: "Your rights", text: "You can request access, correction or deletion of your data by contacting us." }


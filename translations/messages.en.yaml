how:
  title: "How Mzian turns your idea into a live solution"
  lead: "You describe your business, AI proposes the right solution at the right price, a Mzian administrator validates it, then our AI agents build and deliver your application."
  steps:
    describe: { title: "Describe your business", text: "Choose your industry and explain what you need in your own words, in French, English or Arabic." }
    questions: { title: "A few targeted questions", text: "Questions adapt to your answers: number of vehicles, bookings, payments, contracts…" }
    analysis: { title: "AI analysis", text: "AI turns your request into structured requirements and recommends the right solution." }
    proposal: { title: "Clear proposal and price", text: "Features, hosting, domain name and services: a price computed transparently." }
    order: { title: "Order and payment", text: "Order online and pay securely." }
    validation: { title: "Human validation", text: "A Mzian administrator reviews and approves the launch of your project." }
    build: { title: "Automated build", text: "AI agents book the hosting, configure the domain and build your solution from proven templates." }
    quality: { title: "Testing and quality control", text: "Real technical checks are executed: pages, HTTPS, domain, assets, mobile display." }
    delivery: { title: "Delivery", text: "You receive your access, your website address and documentation in your customer area." }
  human:
    title: "One human validation, at the right time"
    text: "After your payment, a Mzian administrator approves the build. Then automation takes over: follow the progress live in your account."
  safety:
    title: "Automation under control"
    budget: "Budgets and spending caps: above them, an administrator must approve."
    secrets: "Credentials are encrypted and never sent in clear text to the AI."
    tests: "No delivery if critical tests fail."
    audit: "Every action is recorded in an audit log."

faq:
  title: "Frequently asked questions"
  lead: "Everything you need to know before launching your project with Mzian."
  more_questions: "Another question? Write to us."
  items:
    what: { q: "What is Mzian?", a: "Mzian is a platform that analyses a small business' needs with AI, proposes a suitable web solution (website, booking, e-commerce, CRM, business app) and builds it automatically." }
    how_long: { q: "How long does it take to go live?", a: "Most template-based solutions are delivered within a few days after your order is approved. The estimated lead time is shown in your proposal." }
    price: { q: "How is the price computed?", a: "The price is computed by our pricing engine (not by the AI alone): base solution, features, hosting, domain name and services. Everything is detailed before you order." }
    ai: { q: "Does the AI decide everything?", a: "No. AI analyses and proposes, a Mzian administrator validates every project and real technical tests check the quality before delivery." }
    domain: { q: "Can I use my own domain name?", a: "Yes. You can provide an existing domain or let us register a new one for you." }
    hosting: { q: "Is hosting included?", a: "Yes, the first year of hosting is included in the proposal. Subscription plans then cover hosting, maintenance and support." }
    changes: { q: "Can I ask for changes?", a: "Yes. Before the build, the administrator may ask you for details; after delivery, support is available from your customer area." }
    own: { q: "Do I own my website?", a: "Yes, your content and data belong to you. Each project has its own code repository." }
    payment: { q: "Which payment methods do you accept?", a: "Card payment (through our payment provider) and bank transfer. Available methods are shown at checkout." }
    languages: { q: "Can my website be multilingual?", a: "Yes: French, English and Arabic (right-to-left) are supported." }


how:
  title: "Comment Mzian transforme votre idée en solution en ligne"
  lead: "Vous décrivez votre activité, l'IA propose la bonne solution au bon prix, un administrateur Mzian valide, puis nos agents IA réalisent et livrent votre application."
  steps:
    describe: { title: "Vous décrivez votre activité", text: "Choisissez votre secteur et expliquez votre besoin avec vos mots, en français, en anglais ou en arabe." }
    questions: { title: "Quelques questions ciblées", text: "Les questions s'adaptent à vos réponses : nombre de véhicules, réservations, paiements, contrats…" }
    analysis: { title: "Analyse par l'IA", text: "L'IA transforme votre demande en exigences structurées et recommande la solution adaptée." }
    proposal: { title: "Proposition et prix clairs", text: "Fonctionnalités, hébergement, nom de domaine et services : un prix calculé de façon transparente." }
    order: { title: "Commande et paiement", text: "Vous commandez en ligne et payez en toute sécurité." }
    validation: { title: "Validation humaine", text: "Un administrateur Mzian vérifie et valide le lancement de votre projet." }
    build: { title: "Réalisation automatisée", text: "Les agents IA réservent l'hébergement, configurent le domaine et développent votre solution à partir de modèles éprouvés." }
    quality: { title: "Tests et contrôle qualité", text: "Des tests techniques réels sont exécutés : pages, HTTPS, domaine, ressources, affichage mobile." }
    delivery: { title: "Livraison", text: "Vous recevez vos accès, l'adresse de votre site et une documentation dans votre espace client." }
  human:
    title: "Une seule validation humaine, au bon moment"
    text: "Après votre paiement, un administrateur Mzian valide la réalisation. Ensuite, l'automatisation prend le relais : vous suivez l'avancement en temps réel dans votre espace."
  safety:
    title: "Une automatisation sous contrôle"
    budget: "Budgets et plafonds de dépenses : au-delà, l'administrateur doit approuver."
    secrets: "Identifiants chiffrés, jamais transmis en clair à l'IA."
    tests: "Aucune livraison si des tests critiques échouent."
    audit: "Chaque action est tracée dans un journal d'audit."

faq:
  title: "Questions fréquentes"
  lead: "Tout ce qu'il faut savoir avant de lancer votre projet avec Mzian."
  more_questions: "Une autre question ? Écrivez-nous."
  items:
    what: { q: "Qu'est-ce que Mzian ?", a: "Mzian est une plateforme qui analyse le besoin d'une petite entreprise grâce à l'IA, propose une solution web adaptée (site, réservation, e-commerce, CRM, application métier) et la réalise de façon automatisée." }
    how_long: { q: "Combien de temps faut-il pour être en ligne ?", a: "La plupart des solutions basées sur nos modèles sont livrées en quelques jours après la validation de votre commande. Le délai estimé est indiqué dans votre proposition." }
    price: { q: "Comment le prix est-il calculé ?", a: "Le prix est calculé par notre moteur de tarification (et non par l'IA seule) : solution de base, fonctionnalités, hébergement, nom de domaine et services. Tout est détaillé avant la commande." }
    ai: { q: "L'IA décide-t-elle de tout ?", a: "Non. L'IA analyse et propose, un administrateur Mzian valide chaque projet et des tests techniques réels contrôlent la qualité avant la livraison." }
    domain: { q: "Puis-je utiliser mon propre nom de domaine ?", a: "Oui. Vous pouvez indiquer un domaine existant ou nous laisser en réserver un nouveau pour vous." }
    hosting: { q: "L'hébergement est-il inclus ?", a: "Oui, la première année d'hébergement est incluse dans la proposition. Des formules d'abonnement couvrent ensuite l'hébergement, la maintenance et le support." }
    changes: { q: "Puis-je demander des modifications ?", a: "Oui. Avant la réalisation, l'administrateur peut vous demander des précisions ; après la livraison, le support est disponible depuis votre espace client." }
    own: { q: "Suis-je propriétaire de mon site ?", a: "Oui, votre contenu et vos données vous appartiennent. Chaque projet dispose de son propre dépôt de code." }
    payment: { q: "Quels moyens de paiement acceptez-vous ?", a: "Le paiement par carte (via notre prestataire de paiement) et le virement bancaire. Les modes disponibles sont affichés lors du paiement." }
    languages: { q: "Mon site peut-il être multilingue ?", a: "Oui : français, anglais et arabe (avec affichage de droite à gauche) sont pris en charge." }

contact:
  title: "Parlons de votre projet"
  lead: "Une question avant de commencer ? Envoyez-nous un message, nous vous répondons rapidement."
  send: "Envoyer le message"
  sent: "Merci ! Votre message a bien été envoyé, nous revenons vers vous rapidement."
  response_time: "Nous répondons généralement sous 24 h ouvrées."
  faster:
    title: "Le plus rapide : décrivez votre besoin"
    text: "En quelques minutes, l'IA analyse votre besoin et vous propose une solution avec son prix."

legal:
  placeholder_notice: "Ce texte est un modèle à faire relire par un juriste avant la mise en production."
  terms:
    title: "Conditions générales"
    service: { title: "Le service", text: "Mzian conçoit et met en ligne des solutions web pour les petites entreprises à partir de l'analyse de leur besoin." }
    orders: { title: "Commandes", text: "Une commande est passée après acceptation d'une proposition chiffrée. Le paiement est requis avant la réalisation." }
    approval: { title: "Validation", text: "Chaque projet est validé par un administrateur Mzian avant le démarrage de la réalisation. En cas de refus, le montant payé est remboursé." }
    delivery: { title: "Livraison", text: "La livraison intervient après réussite des tests techniques et du contrôle qualité. Les accès sont transmis de manière sécurisée dans l'espace client." }
    liability: { title: "Responsabilité", text: "Le client reste responsable des contenus publiés sur sa solution." }
  privacy:
    title: "Politique de confidentialité"
    data: { title: "Données collectées", text: "Nous collectons les informations nécessaires à l'étude et à la réalisation de votre projet (coordonnées, description du besoin, réponses au questionnaire)." }
    analytics: { title: "Mesure d'audience", text: "Notre mesure d'audience n'utilise pas de cookie et ne conserve pas d'adresse IP." }
    ai: { title: "Intelligence artificielle", text: "Votre description peut être analysée par un fournisseur d'IA. Aucun mot de passe ni identifiant ne lui est jamais transmis." }
    security: { title: "Sécurité", text: "Les identifiants sont chiffrés, les accès sont journalisés et protégés." }
    rights: { title: "Vos droits", text: "Vous pouvez demander l'accès, la rectification ou la suppression de vos données en nous contactant." }

